name: Feature
description: A change for the Deviosh studio site
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Ideas for the public site only. Do not invent App Store URLs or change
        the PFRA privacy policy URL unless Josh confirms the canonical link.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Homepage
        - PFRA Tracker page
        - Metadata / SEO
        - CI / docs
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What should change, and why it helps the studio.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Constraints, mocks, or out-of-scope items.
