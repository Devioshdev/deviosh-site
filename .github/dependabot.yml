# Weekly npm version updates for the Next.js site.
# Minor/patch are grouped; major stays ungrouped for individual review.
# Security updates stay ungrouped (GitHub default).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
